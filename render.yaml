# Blueprint de Render (opcional): permite crear el servicio con un clic.
# Las variables marcadas con sync: false se llenan a mano en el panel de Render.
services:
  - type: web
    name: sala-fis-chat
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: node index.js
    healthCheckPath: /healthz
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: TIMEZONE
        value: America/Guayaquil
      - key: JWT_EXPIRES_IN
        value: 15m
      - key: JWT_SECRET
        generateValue: true
      - key: ALLOWED_ORIGINS
        sync: false
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_APP_ID
        sync: false
      - key: FIREBASE_CLIENT_EMAIL
        sync: false
      - key: FIREBASE_PRIVATE_KEY
        sync: false
